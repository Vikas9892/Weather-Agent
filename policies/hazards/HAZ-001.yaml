id: HAZ-001
version: 1.0.0
status: active
title: "Severe Compound Weather: Heavy Rainfall and Squall Gale Alert"
category: hazards
activities:
  - all
  - cycling
  - exercise
  - hiking
  - recreation
  - family
  - travel
severity: extreme
priority: 100
conditions:
  any:
    - field: precipitation
      operator: ">="
      value: 30.0
    - all:
        - field: precipitation
          operator: ">="
          value: 15.0
        - field: wind_gusts_10m
          operator: ">="
          value: 45.0
evidence:
  - precipitation
  - wind_gusts_10m
  - weather_code
decision: >-
  Cancel all non-essential outdoor activities immediately due to an active heavy rainfall system.
  Seek sturdy indoor shelter and avoid low-lying roads, underpasses, and flood-prone drainage paths.
rationale: >-
  Severe compound weather combining localized torrential downpours exceeding drainage capacities with squally
  wind gusts rapidly creates flash waterlogging, flying debris hazards, and hazardous road traction conditions.
tags:
  - compound-hazard
  - severe-storm
  - flood
  - extreme-rain
overrides:
  - CYC-002
  - TRV-001
  - REC-001
source: Severe Weather Standard Operating Procedure & Compound Hazard Safety Guidelines
effective_from: "2024-01-01"
