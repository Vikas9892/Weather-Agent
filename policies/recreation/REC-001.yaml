id: REC-001
version: 1.0.0
status: active
title: Unfavorable Damp Ground and Drizzle Risk for Picnics
category: recreation
activities:
  - picnic
  - gathering
  - barbecue
  - park_outing
severity: moderate
priority: 45
conditions:
  any:
    - field: precipitation
      operator: ">"
      value: 0.5
    - field: precipitation_probability
      operator: ">="
      value: 50
evidence:
  - precipitation
  - precipitation_probability
decision: >-
  Picnic conditions are suboptimal. Bring a waterproof tarpaulin or ground-mat, identify nearby covered park pavilions,
  and pack weather-resistant food containers. Have an indoor contingency plan if rain chances materialize.
rationale: >-
  Even modest precipitation or elevated rain probability (>50%) leads to water-soaked turf, soil mud saturation,
  and ruined paper goods, diminishing outdoor dining comfort.
tags:
  - picnic
  - recreation
  - damp-ground
overrides: []
source: Parks and Recreation Community Safety Guidelines
effective_from: "2024-01-01"
