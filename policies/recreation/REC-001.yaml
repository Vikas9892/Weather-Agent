id: REC-001
version: 1.0.0
status: active
title: "Picnic Multi-Factor Suitability: Damp Ground and Elevated Rain Risk"
category: recreation
activities:
  - picnic
  - gathering
  - barbecue
  - park_outing
severity: moderate
priority: 45
conditions:
  any:
    - field: precipitation
      operator: ">"
      value: 0.5
    - field: precipitation_probability
      operator: ">="
      value: 50
evidence:
  - precipitation
  - precipitation_probability
decision: >-
  Picnic conditions are suboptimal or conditionally suitable. Bring a waterproof tarpaulin or ground-mat, identify nearby covered park pavilions,
  and pack weather-resistant food containers. Have an indoor contingency plan if rain chances materialize.
rationale: >-
  Multi-factor evaluation: Even modest precipitation or elevated rain probability (>50%) leads to water-soaked turf, soil moisture saturation,
  and ruined paper goods, diminishing outdoor dining comfort.
tags:
  - picnic
  - recreation
  - multi-factor-suitability
  - damp-ground
overrides: []
source: project_defined
effective_from: "2024-01-01"
