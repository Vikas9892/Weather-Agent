<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e2640"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="backPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="frontPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Shield Base: communicates safety and protection -->
  <path d="M16 2 C22.5 2 28 4.2 28 7.5 C28 17.5 21.5 25.5 16 29.5 C10.5 25.5 4 17.5 4 7.5 C4 4.2 9.5 2 16 2 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>

  <!-- Back Mountain Peak (Atmospheric Cyan) -->
  <path d="M13.5 23 L20 12 L25.5 22.5 Z" fill="url(#backPeak)" opacity="0.9"/>
  <!-- Back Peak Snowcap -->
  <path d="M20 12 L21.8 15.2 L18.2 15.2 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Front Mountain Peak (Lush Outdoor Emerald) -->
  <path d="M6.5 24 L14 10.5 L21.5 24 Z" fill="url(#frontPeak)"/>
  <!-- Front Peak Snowcap -->
  <path d="M14 10.5 L16.5 14.8 L14.8 14.2 L13.2 15.1 L11.5 14.8 Z" fill="#ffffff"/>

  <!-- Sun / Safety Flare: communicates weather clarity and guidance -->
  <circle cx="21.5" cy="7.5" r="2.2" fill="#fbbf24"/>
  <circle cx="21.5" cy="7.5" r="3.2" fill="#fbbf24" opacity="0.25"/>
</svg>
